plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing: /workspace/keystore/keystore.properties (see /workspace/keystore/README.txt). Override with -PkeystoreProps=/path or env KEYSTORE_PROPS.
def ksPropsFile = new File(project.findProperty('keystoreProps') ?: System.getenv('KEYSTORE_PROPS') ?: '/workspace/keystore/keystore.properties')
def ksProps = new Properties()
if (ksPropsFile.exists()) ksPropsFile.withInputStream { ksProps.load(it) }

android {
    namespace 'dev.optimizer.android'
    compileSdk 34

    defaultConfig {
        // minSdk 21 = Android 5.0, the lowest the Compose / Material 3 / WorkManager / lifecycle stack supports (all declare minSdk 21).
        minSdk 21
        // targetSdk 34 on purpose (installable everywhere; a Google Play upload today would need 35 - see README).
        targetSdk 34
        versionCode 6
        versionName '1.5.1'
        // No native code of our own; no ndk.abiFilters, so a single universal APK carries whatever ABIs the dependencies ship.
    }

    // Two editions that can be installed side by side:
    //  rooted   = dev.optimizer.android           (root via su > Shizuku > plain)
    //  standard = dev.optimizer.android.standard  (never runs su; Shizuku / ADB-granted permissions > plain)
    flavorDimensions 'edition'
    productFlavors {
        rooted {
            dimension 'edition'
            applicationId 'dev.optimizer.android'
            buildConfigField 'boolean', 'ROOT_EDITION', 'true'
            buildConfigField 'String', 'EDITION', '"rooted"'
        }
        standard {
            dimension 'edition'
            applicationId 'dev.optimizer.android.standard'
            buildConfigField 'boolean', 'ROOT_EDITION', 'false'
            buildConfigField 'String', 'EDITION', '"standard"'
        }
    }

    signingConfigs {
        release {
            if (ksPropsFile.exists()) {
                storeFile file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug { debuggable true }
        release {
            // R8 with a conservative rule set (own package kept, so only unused library code is removed; no reflection surprises).
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (ksPropsFile.exists()) signingConfig signingConfigs.release
        }
    }
    // one universal APK (no ABI / density splits)
    splits { abi { enable false }; density { enable false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true; buildConfig true; aidl true }
    composeOptions { kotlinCompilerExtensionVersion '1.5.14' }
    lint { abortOnError false; checkReleaseBuilds false }
    testOptions { unitTests.returnDefaultValues = true }
    packaging { resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' } }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.09.00')
    implementation composeBom
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    // Shizuku (official API, https://github.com/RikkaApps/Shizuku-API): optional shell-level access without root.
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
